name: CI / Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-validate:
    name: Lint, Arquitectura y Aislamiento de Tablas
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout de código
        uses: actions/checkout@v7

      - name: Instalar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Verificación de tipos TypeScript
        run: pnpm typecheck

      - name: Consistencia de copias generadas de migraciones D1
        run: pnpm db:check-migrations

      - name: Consistencia de bindings Cloudflare en ambas configuraciones Wrangler
        run: pnpm cloudflare:check-bindings

      - name: Aplicación SQL desde cero y actualización compatible
        run: pnpm db:test-migrations

      - name: Orden real de Wrangler en una D1 local vacía e idempotencia
        run: pnpm db:test-wrangler-migrations

      - name: Lint de reglas de arquitectura (200 líneas, capas, imports)
        run: pnpm lint

      - name: Test de aislamiento estricto de tablas D1
        run: pnpm test:isolation

      - name: Ejecución de pruebas unitarias
        run: pnpm test

      - name: Pruebas del Worker en Miniflare (D1, CSRF, límites y webhook)
        run: pnpm test:workers

  security-scan:
    name: Escaneo de Secretos (Gitleaks)
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout de todo el historial
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
