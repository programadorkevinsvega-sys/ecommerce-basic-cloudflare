name: Deploy Staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecommerce-staging-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Migrar y desplegar Worker de staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Instalar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Verificar aislamiento de recursos
        run: pnpm staging:check

      - name: Aplicar migraciones únicamente a D1 de staging
        run: pnpm db:migrate:remote
        working-directory: apps/api
        env:
          ALLOW_REMOTE_D1_MIGRATIONS: "1"
          ECOMMERCE_D1_DATABASE: ecommerce-vega-staging
          ECOMMERCE_WRANGLER_CONFIG: wrangler.staging.jsonc
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Desplegar Worker de staging (sin rutas productivas)
        run: pnpm exec wrangler deploy --config apps/api/wrangler.staging.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
